name: CI

# The compiled engine artifact is not present in this repo (fetched from a
# release), so CI exercises only what is checkable without the wasm: shell
# script syntax and any pure JS glue that ships with the demo. The engine-driven
# smoke tests (demo/smoke*.mjs) need the fetched wasm and run in the
# artifact/release verification flow, not here.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  checks:
    name: Repo checks (no wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Fetch/build scripts are the load-bearing hand-authored surface here;
      # a syntax error would break the "run the demo" path silently.
      - name: shellcheck scripts
        run: |
          for f in scripts/*.sh; do
            bash -n "$f"
          done
      # The demo's SQL playground ships hand-authored JS glue (statement router,
      # editor, formatter) with pure unit tests — no wasm import — so they run
      # here. globstar is required for the demo/**/ recursion.
      - name: JS glue unit tests (if any)
        run: |
          shopt -s nullglob globstar
          tests=(demo/**/*.test.mjs)
          if [ ${#tests[@]} -gt 0 ]; then
            node --test "${tests[@]}"
          else
            echo "no JS glue unit tests present — skipping"
          fi
      # The headless E2E (demo/e2e_ops.mjs) drives the real page in Chromium. It
      # needs the wasm bundle, which this repo fetches from a release and CI does
      # not have — so the script self-skips (exit 0) when pkg-web/ is absent. We
      # still syntax-check it and run it, so the moment a fetchable artifact
      # exists the browser coverage turns on with no workflow change.
      - name: E2E script syntax
        run: |
          node --check demo/e2e_ops.mjs
          node --check demo/agent/e2e_agent.mjs
      - name: Headless E2E (skips without wasm)
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          npm run e2e
          npm run e2e:agent
