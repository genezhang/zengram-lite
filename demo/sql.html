<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>zengram-lite — SQL playground</title>
    <style>
      :root {
        --bg: #0f1115; --panel: #171a21; --panel2: #1e222b; --border: #2a2f3a;
        --text: #e6e9ef; --muted: #8b93a3; --accent: #6ea8fe; --accent2: #7ee0a2;
        --err: #ff6b6b;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; font: 15px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: var(--bg); color: var(--text);
        display: grid; grid-template-rows: auto 1fr; height: 100vh;
      }
      header { padding: 12px 20px; border-bottom: 1px solid var(--border);
        display: flex; align-items: center; gap: 12px; }
      header h1 { font-size: 15px; margin: 0; font-weight: 600; }
      header .tag { font-size: 12px; color: var(--muted); }
      #status { margin-left: auto; font-size: 12px; color: var(--muted); }
      #status.ready { color: var(--accent2); }
      #status.err { color: var(--err); }
      main { display: grid; grid-template-columns: 1fr 1fr; min-height: 0; }
      .col { display: flex; flex-direction: column; min-height: 0; }
      .col.left { border-right: 1px solid var(--border); }
      .toolbar { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 14px;
        border-bottom: 1px solid var(--border); background: var(--panel); }
      .toolbar button { background: var(--panel2); color: var(--text); border: 1px solid var(--border);
        padding: 5px 10px; border-radius: 6px; font-size: 12px; cursor: pointer; }
      .toolbar button:hover { border-color: var(--accent); }
      textarea {
        flex: 1; resize: none; background: #0b0d12; color: var(--text); border: 0;
        padding: 16px; font: 13px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        outline: none; min-height: 120px;
      }
      .runbar { display: flex; gap: 8px; padding: 12px 14px; border-top: 1px solid var(--border); }
      .runbar button { background: var(--accent); color: #0b0d12; border: 0; padding: 8px 18px;
        border-radius: 8px; font: inherit; font-weight: 600; cursor: pointer; }
      .runbar button:disabled { opacity: 0.5; cursor: default; }
      .runbar .hint { align-self: center; font-size: 12px; color: var(--muted); }
      .col.right { overflow: auto; }
      .out { padding: 16px; }
      .out .stmt { margin-bottom: 18px; }
      .out .sql { font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace; color: var(--muted);
        margin-bottom: 6px; white-space: pre-wrap; }
      .out .meta { font-size: 12px; color: var(--accent2); margin-bottom: 6px; }
      .out .meta.err { color: var(--err); }
      table { border-collapse: collapse; font-size: 13px; width: 100%; }
      th, td { text-align: left; padding: 5px 10px; border: 1px solid var(--border); }
      th { background: var(--panel2); color: var(--accent); font-weight: 600; }
      td { font-family: ui-monospace, Menlo, Consolas, monospace; }
      td.null { color: var(--muted); font-style: italic; }
      .empty { color: var(--muted); font-size: 13px; }
    </style>
  </head>
  <body>
    <header>
      <h1>🗄️ zengram-lite · SQL</h1>
      <span class="tag">the full Zeta engine — same bundle as the memory demo, one wasm, one heap</span>
      <a href="./index.html" style="font-size:12px;color:var(--accent);text-decoration:none;">← memory demo</a>
      <span id="status">loading…</span>
    </header>

    <main>
      <div class="col left">
        <div class="toolbar" id="examples"></div>
        <textarea id="editor" spellcheck="false" placeholder="Write SQL here. Ctrl/Cmd+Enter to run."></textarea>
        <div class="runbar">
          <button id="run" disabled>Run ▸</button>
          <span class="hint">Ctrl/Cmd+Enter · statements run in order · one transaction per Run</span>
        </div>
      </div>
      <div class="col right">
        <div class="out" id="out">
          <div class="empty">Results appear here. Pick an example above, or write your own SQL and Run.</div>
        </div>
      </div>
    </main>

    <script type="module">
      import init, { ZetaDb } from "./pkg-web/zengram_wasm.js";

      const $status = document.getElementById("status");
      const $editor = document.getElementById("editor");
      const $run = document.getElementById("run");
      const $out = document.getElementById("out");
      const $examples = document.getElementById("examples");

      let db;

      // A handful of examples that exercise distinct engine features. Each is a
      // full script (multiple statements) run top-to-bottom.
      const EXAMPLES = {
        "DDL + insert": `-- Create a table and fill it. Placeholders are $1, $2 … (Postgres-style).
CREATE TABLE task (
  id       INTEGER PRIMARY KEY,
  title    TEXT NOT NULL,
  done     BOOLEAN DEFAULT false,
  priority INTEGER
);
INSERT INTO task (id, title, done, priority) VALUES
  (1, 'ship the SQL demo', false, 1),
  (2, 'write the docs',    false, 3),
  (3, 'clear the SW cache', true, 2);
SELECT * FROM task ORDER BY priority;`,

        "Filter + aggregate": `-- Aggregates, GROUP BY, HAVING all route through the engine.
SELECT done,
       count(*)      AS n,
       sum(priority) AS total_priority,
       avg(priority) AS avg_priority
FROM task
GROUP BY done
ORDER BY done;`,

        "Join + CTE": `-- Tag each task, roll the tags up in a CTE, then join to the tasks.
CREATE TABLE tag (task_id INTEGER, label TEXT);
INSERT INTO tag VALUES (1, 'demo'), (1, 'urgent'), (2, 'writing'), (3, 'chore');

WITH tag_counts AS (
  SELECT task_id, count(*) AS n, string_agg(label, ', ') AS labels
  FROM tag
  GROUP BY task_id
)
SELECT t.title, c.n AS num_tags, c.labels
FROM task t
JOIN tag_counts c ON c.task_id = t.id
ORDER BY t.title;`,

        "Window function": `-- Rank open tasks by priority with a window function.
SELECT title,
       priority,
       row_number() OVER (ORDER BY priority)          AS rank,
       sum(priority) OVER (ORDER BY priority)          AS running_total
FROM task
WHERE done = false
ORDER BY priority;`,

        "Transaction + savepoint": `-- Explicit transaction with a savepoint and partial rollback.
BEGIN;
UPDATE task SET done = true WHERE id = 1;
SAVEPOINT sp1;
UPDATE task SET priority = 99 WHERE id = 2;   -- we'll undo just this
ROLLBACK TO SAVEPOINT sp1;
COMMIT;
SELECT id, title, done, priority FROM task ORDER BY id;`,

        "JSON": `-- JSONB is a first-class type with operators and builders.
CREATE TABLE doc (id INTEGER PRIMARY KEY, body JSONB);
INSERT INTO doc VALUES
  (1, '{"kind":"note","tags":["a","b"],"score":7}'),
  (2, '{"kind":"todo","tags":["b"],"score":3}');

SELECT id,
       body->>'kind'              AS kind,
       (body->>'score')::int      AS score,
       jsonb_array_length(body->'tags') AS n_tags
FROM doc
WHERE body @> '{"tags":["b"]}'
ORDER BY score DESC;`,

        "Reset (drop all)": `DROP TABLE IF EXISTS task;
DROP TABLE IF EXISTS tag;
DROP TABLE IF EXISTS doc;`,
      };

      for (const name of Object.keys(EXAMPLES)) {
        const b = document.createElement("button");
        b.textContent = name;
        b.addEventListener("click", () => { $editor.value = EXAMPLES[name]; $editor.focus(); });
        $examples.appendChild(b);
      }

      // Split a script into statements on ';' at top level (naive but fine for a
      // demo — it doesn't try to parse strings containing ';'). We keep BEGIN/
      // COMMIT/SAVEPOINT as their own statements so the txn spans them.
      function splitStatements(sql) {
        return sql
          .split(/;\s*(?:\n|$)/)
          .map((s) => s.replace(/^\s*--.*$/gm, "").trim())
          .filter((s) => s.length > 0);
      }

      // Decide execMut vs query by leading keyword. SELECT / WITH / EXPLAIN /
      // SHOW return rows; everything else is a mutation/DDL/txn-control.
      function isQuery(stmt) {
        return /^\s*(SELECT|WITH|EXPLAIN|SHOW|VALUES|TABLE)\b/i.test(stmt);
      }

      function renderTable(result) {
        const cols = result.columns || [];
        const rows = result.rows || [];
        if (!cols.length) return `<div class="empty">(no columns)</div>`;
        if (!rows.length) return `<div class="empty">0 rows · columns: ${cols.join(", ")}</div>`;
        const head = `<tr>${cols.map((c) => `<th></th>`).join("")}</tr>`;
        const table = document.createElement("table");
        table.innerHTML = head;
        table.querySelectorAll("th").forEach((th, i) => (th.textContent = cols[i]));
        for (const r of rows) {
          const tr = document.createElement("tr");
          for (const c of cols) {
            const td = document.createElement("td");
            const v = r[c];
            if (v === null || v === undefined) { td.className = "null"; td.textContent = "NULL"; }
            else if (typeof v === "object") td.textContent = JSON.stringify(v);
            else td.textContent = String(v);
            tr.appendChild(td);
          }
          table.appendChild(tr);
        }
        return table;
      }

      function block(sql, metaHtml, metaCls, body) {
        const d = document.createElement("div");
        d.className = "stmt";
        const s = document.createElement("div"); s.className = "sql"; s.textContent = sql;
        const m = document.createElement("div"); m.className = "meta" + (metaCls ? " " + metaCls : "");
        m.textContent = metaHtml;
        d.appendChild(s); d.appendChild(m);
        if (body) d.appendChild(typeof body === "string" ? Object.assign(document.createElement("div"), { innerHTML: body }) : body);
        return d;
      }

      function run() {
        const script = $editor.value.trim();
        if (!script || !db) return;
        $out.innerHTML = "";
        const stmts = splitStatements(script);
        let hadError = false;
        for (const stmt of stmts) {
          try {
            if (isQuery(stmt)) {
              const res = db.query(stmt, null);
              const n = (res.rows || []).length;
              $out.appendChild(block(stmt, `${n} row${n === 1 ? "" : "s"}`, "", renderTable(res)));
            } else {
              const affected = db.execMut(stmt, null);
              // execDdl vs execMut: CREATE/DROP/ALTER return no count. Try execMut
              // first (it also handles DDL), falling back only if it complains.
              $out.appendChild(block(stmt, `ok · ${affected} row${affected === 1 ? "" : "s"} affected`, ""));
            }
          } catch (e) {
            // DDL (CREATE/DROP/ALTER/BEGIN/COMMIT/…) goes through execDdl, which
            // execMut rejects. Retry as DDL before declaring a real error.
            try {
              db.execDdl(stmt);
              $out.appendChild(block(stmt, "ok", ""));
            } catch (e2) {
              hadError = true;
              $out.appendChild(block(stmt, "error: " + (e2?.message || e2), "err"));
            }
          }
        }
        $status.textContent = hadError ? "ran with errors" : "ok";
        $status.className = hadError ? "err" : "ready";
      }

      $run.addEventListener("click", run);
      $editor.addEventListener("keydown", (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); run(); }
      });

      (async function boot() {
        try {
          await init();
          db = ZetaDb.open();
          $status.textContent = "ready · in-memory database";
          $status.className = "ready";
          $run.disabled = false;
          $editor.value = EXAMPLES["DDL + insert"];
          $editor.focus();
        } catch (e) {
          $status.textContent = "failed: " + (e?.message || e);
          $status.className = "err";
          console.error(e);
        }
      })();
    </script>
  </body>
</html>
